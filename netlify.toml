[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify detects Next.js and installs its official adapter automatically.
# Configure optional OPENAI_API_KEY only as a secret scoped to Functions.
# Set NEXT_PUBLIC_SITE_URL if you later attach a custom domain.
